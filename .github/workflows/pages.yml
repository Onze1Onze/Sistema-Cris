name: Deploy extension to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract TypeScript source modules
        run: |
          unzip -o source-core.zip -d .
          unzip -o source-sync.zip -d .
          unzip -o source-ui-shell.zip -d .
          unzip -o source-ui-style.zip -d .
          unzip -o source-docs.zip -d .
      - name: Apply current Owlbear UI bundle
        run: |
          base64 --decode source-ui-fix.zip.b64 > /tmp/source-ui-fix.zip
          unzip -o /tmp/source-ui-fix.zip -d .
      - uses: actions/configure-pages@v5
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Set extension manifest version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'dist/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = '0.2.1';
          manifest.name = 'Conexão com CRIS';
          manifest.description = 'Importe fichas públicas do C.R.I.S. e visualize os dados do agente em um dossiê no Owlbear Rodeo.';
          manifest.action = {
            ...manifest.action,
            title: 'Conexão com CRIS',
            width: 390,
            height: 720
          };
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2));
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
