name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract TypeScript source modules
        run: |
          unzip -o source-core.zip -d .
          unzip -o source-sync.zip -d .
          unzip -o source-ui-shell.zip -d .
          unzip -o source-ui-style.zip -d .
          unzip -o source-docs.zip -d .
      - name: Apply current Owlbear UI bundle
        run: |
          base64 --decode source-ui-fix.zip.b64 > /tmp/source-ui-fix.zip
          unzip -o /tmp/source-ui-fix.zip -d .
      - name: Apply maintained CRIS extension icon
        run: |
          mkdir -p public
          cp branding/icon.svg public/icon.svg
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
